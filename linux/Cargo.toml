[package]
name = "zfirm-linux"
version = "0.1.0"
edition = "2024"
description = "ZFirm on Linux: a Zcash shielded signer for a Pi Zero, a jailbroken Kindle or any Linux board"
license = "MIT OR Apache-2.0"

[lib]
name = "zfirm_linux"
path = "src/lib.rs"

[[bin]]
name = "zfirm"
path = "src/main.rs"

[features]
# The Waveshare 1.3" LCD HAT on a Pi Zero (ST7789 over SPI, joystick and keys over GPIO).
lcd = ["dep:spidev", "dep:gpio-cdev"]

[dependencies]
zfirm-core = { path = "../core", features = ["english"] }
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
libc = "0.2"
orchard = { version = "0.15", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
pasta_curves = { version = "0.5", default-features = false, features = ["alloc"] }
sinsemilla = "0.1"
zeroize = "1"
font8x8 = "0.3"
gpio-cdev = { version = "0.6", optional = true }
spidev = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"
