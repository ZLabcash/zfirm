[package]
name = "zfirm-core"
version = "0.1.0"
edition = "2024"
description = "ZFirm: the Zcash shielded signer core shared by every ZFirm device (no_std + alloc)"
license = "MIT OR Apache-2.0"

[features]
# Embed the BIP 39 English word list (host tools and tests; the device reads it from SD).
english = []

[dependencies]
aes = { version = "0.8", default-features = false }
f4jumble = { version = "0.1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
blake2b_simd = { version = "1", default-features = false, features = ["uninline_portable"] }
nonempty = { version = "0.11", default-features = false }
orchard = { version = "0.15", default-features = false }
pasta_curves = { version = "0.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
zip32 = { version = "0.2", default-features = false }
zcash_note_encryption = { version = "0.4.2", default-features = false }

[dev-dependencies]
aes = "0.8"
bip39 = "2"
fpe = "0.6"
hex = "0.4"
pbkdf2 = { version = "0.12", features = ["hmac"] }
qrcodegen = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zcash_address = "0.13"
zcash_keys = { version = "0.16", features = ["orchard"] }
zcash_protocol = { version = "0.10" }
zip32 = "0.2"
